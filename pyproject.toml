[project]
name = "stock"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv",
    "openai",
    "google-generativeai",
    "ipykernel==6.29.5",
    "jupyter-client==8.6.3",
    "traitlets==5.14.3",
    "pyzmq==26.2.1",
    "ipywidgets==8.1.8",
    "jupyterlab-widgets",
    "numpy",
    "matplotlib",
    "fastdtw",
    "scipy",
    "duckdb",
    "pandas",
    "torch",
    "optuna",
    "statsmodels",
    "pyupbit",
    "scikit-learn",
    "tabulate",
    "scrapling",
    "dtaidistance>=2.4.0",
    # GPU 사용률·온도·전력 조회용(torch.cuda.utilization 등이 이 패키지를 요구).
    # 2026-08-14 현재 이 서버는 커널 모듈(595.71.05)과 유저스페이스 라이브러리(595.84) 버전
    # 불일치로 NVML 자체가 막혀 있어 실제 값은 재부팅 후에 나온다. 이 패키지가 없어도
    # test/scripts/gpu_status.py는 메모리 조회까지 정상 동작한다(드라이버 API 경로).
    "nvidia-ml-py",
    # Hugging Face 연구 스택(문헌·임베딩·모델 실험용). 서버 리셋으로 홈이 초기화되면
    # venv가 날아가므로 pyproject에 명시해 uv sync로 복원되게 둔다(2026-08-31 재추가).
    "huggingface-hub",
    "transformers",
    "datasets",
    "sentence-transformers",
    "accelerate",
    "peft",
    "trl",
    "evaluate",
    "hf-transfer",
    "xgboost>=3.2.0",
    "lightgbm>=4.7.0",
    "arch>=8.0.0",
]

